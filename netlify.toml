[build]
  publish = "public"
  command = "node scripts/build-manifest.mjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Maps are content-addressed (the manifest adds ?v=<hash>), so cache them hard.
[[headers]]
  for = "/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest must always be fresh so new/removed maps show up.
[[headers]]
  for = "/maps-manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
